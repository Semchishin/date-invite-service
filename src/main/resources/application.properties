spring.application.name=date-invite-service

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:mydatabase}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:myuser}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:secret}}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

app.content-file=${CONTENT_FILE:data/content.json}
app.timezone=${APP_TIMEZONE:Europe/Moscow}

app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:changeme}

server.port=${SERVER_PORT:8080}
server.error.include-message=never
spring.mvc.problemdetails.enabled=false

logging.level.root=INFO
logging.level.semchishin.dateinviteservice=${LOG_LEVEL:INFO}
logging.level.org.springframework.web=${LOG_LEVEL_SPRING:INFO}
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n
